<!DOCTYPE html>
<!--

Zombie Check - Standalone Nostr Activity Checker

Part of: Plebs vs. Zombies (https://plebsvszombies.cc)

Checks whether any Nostr user is a "zombie" (inactive) and shows how long
they've been gone, by scanning relays for their most recent activity.
Self-contained (mirrors resurrector.html) so the shared /zombiecheck link
shows a real social preview AND a working tool to crawlers and humans alike.

Classification bands mirror the in-app ZombieCheck.vue component:
  < 60d         Alive
  60-119d       Possible Infection
  120-179d      Fresh Zombie
  180-364d      Rotting Zombie
  365d+ / none  Ancient Zombie
  deleted flag  Burned

-->

  <script type="module">
    // Keep in step with the nostr-tools version in package.json.
    import { SimplePool, nip19 } from 'https://esm.sh/nostr-tools@2.25.2';

    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.primal.net',
      'wss://relay.snort.social',
      'wss://purplepag.es',
      'wss://relay.nostr.net',
      'wss://offchain.pub',
      'wss://nostr.mom',
      'wss://relay.noswhere.com',
      'wss://relay.0xchat.com',
    ];
    // Liveness detection: any event a user signs proves their key is still in
    // use, so the activity query below omits `kinds` entirely. A lurker who
    // only reacts, zaps, or edits a mute list is alive, not a zombie — and
    // narrowing to a few "social" kinds was the main source of false positives
    // (article-only writers, NIP-22 commenters and quiet reactors looked dead).
    //
    // LIVENESS_KINDS is only a fallback for relays that mishandle kind-less
    // filters. Kind 9735 (zap receipt) is absent on purpose — receipts are
    // signed by the recipient's zapper service, not by the user, so they never
    // match an `authors` filter. Kind 9734 is the one the user actually signs.
    // Mirrors LIVENESS_KINDS in src/services/nostrService.js.
    const LIVENESS_KINDS = [
      0, 1, 3, 4, 5, 6, 7, 8, 16, 20, 40, 41, 42, 1063, 1068, 1111, 1311, 1617,
      1621, 1984, 1985, 9734, 9802, 10000, 10001, 10002, 10003, 10015, 10030,
      30000, 30001, 30002, 30003, 30008, 30009, 30017, 30018, 30023, 30024,
      30078, 30311, 30315, 30402, 30617, 30618, 31922, 31923, 31924, 31925,
      31989, 31990, 34235, 34550,
    ];

    const RELAY_TIMEOUT = 4000;   // per relay — one slow relay must not stall the check
    const PROFILE_TIMEOUT = 2500; // profile/relay-list lookups aren't verdict-critical
    const ALIVE_DAYS = 60;        // inside this band the verdict can't change, so stop early

    function newestDays(events) {
      if (!events.length) return null;
      const newest = Math.max(...events.map((e) => e.created_at));
      return Math.floor((Date.now() / 1000 - newest) / 86400);
    }

    function relayName(url) {
      return url.replace(/^wss?:\/\//, '').replace(/\/$/, '');
    }

    // Query relays one at a time rather than as a single pool call, so the user
    // sees which relay is being searched and a slow or dead one can't hold the
    // whole check hostage.
    async function scanRelays(pool, relays, filter, groupLabel, stopWhen = null) {
      const found = [];
      let answered = 0;
      let resolveEarly;
      const early = new Promise((resolve) => { resolveEarly = resolve; });

      const tick = (url) => {
        answered++;
        const newest = newestDays(found);
        const seen = newest === null
          ? 'nothing yet'
          : `newest ${formatGone(newest)} ago`;
        els.progress.textContent =
          `Searching ${groupLabel} — ${answered}/${relays.length} answered ` +
          `(${relayName(url)}) · ${found.length} events, ${seen}`;
        // Once the answer can't change, don't keep the user waiting on the
        // slowest relay in the set.
        if (stopWhen && stopWhen(found)) resolveEarly();
      };

      const all = Promise.all(relays.map(async (url) => {
        try {
          const evs = await pool.querySync([url], filter, { maxWait: RELAY_TIMEOUT });
          found.push(...evs);
        } catch (_) {
          // Unreachable relay — silence from one relay is not evidence of death.
        } finally {
          tick(url);
        }
      }));

      // Whichever comes first: every relay answered, or the verdict is settled.
      // Stragglers keep running harmlessly and are dropped when the pool closes.
      await Promise.race([all, early]);
      return found;
    }

    // The verdict is settled once we've seen activity inside the "Alive" band.
    const settledAlive = (evs) => {
      const days = newestDays(evs);
      return days !== null && days < ALIVE_DAYS;
    };

    // U+1FAC0 (anatomical heart) arrived in Emoji 13.0 (2020). Every other
    // emoji here predates 2017, so on a platform whose emoji font stopped
    // before 13.0 — notably Windows 10, which never got it — the "Alive!"
    // verdict renders as a blank box while everything around it is fine.
    // Since that's the most common verdict, detect the gap once and swap in
    // an SVG only for those users; anyone whose system has the glyph keeps
    // their own native artwork. Mirrors ZombieCheck.vue.
    const HEART_FALLBACK_SRC = '/heart-anatomical.svg';
    let heartGlyphSupported = null;

    function supportsAnatomicalHeart() {
      if (heartGlyphSupported !== null) return heartGlyphSupported;
      try {
        const ctx = document.createElement('canvas').getContext('2d');
        if (!ctx) return (heartGlyphSupported = false);
        ctx.font = '32px sans-serif';
        const heart = ctx.measureText('\u{1FAC0}').width;
        const missing = ctx.measureText('\uFFFF').width;      // unassigned
        const present = ctx.measureText('\u{1F480}').width;   // skull, Emoji 1.0
        // A glyph the font lacks collapses to the same notdef box as U+FFFF;
        // a real emoji matches the advance width of other emoji.
        heartGlyphSupported = heart !== missing && heart === present;
      } catch (_) {
        heartGlyphSupported = false; // fall back to the SVG, which always renders
      }
      return heartGlyphSupported;
    }

    // Display bands — mirrors src/components/ZombieCheck.vue
    function classify(days, deleted) {
      if (deleted) {
        return { emoji: '🔥', label: 'Burned', color: '#d1d5db', border: '#4b5563',
          detail: 'This account has been marked as deleted.' };
      }
      if (days == null) {
        return { emoji: '💀', label: 'Ancient Zombie', color: '#f87171', border: '#b91c1c',
          detail: 'No activity found on any relay we checked.' };
      }
      if (days < 60) {
        return { emoji: '🫀', iconFallback: HEART_FALLBACK_SRC,
          label: 'Alive!', color: '#5cdb5c', border: '#5cdb5c',
          detail: `Active — last seen ${formatGone(days)} ago.`, beat: true };
      }
      if (days < 120) {
        return { emoji: '💛', label: 'Possible Infection', color: '#fde047', border: '#eab308',
          detail: `Quiet for ${formatGone(days)}. Has anyone done a wellness visit lately?` };
      }
      if (days < 180) {
        return { emoji: '🧟', label: 'Fresh Zombie', color: '#facc15', border: '#ca8a04',
          detail: `Gone for ${formatGone(days)}.` };
      }
      if (days < 365) {
        return { emoji: '🧟‍♂️', label: 'Rotting Zombie', color: '#fb923c', border: '#ea580c',
          detail: `Gone for ${formatGone(days)}.` };
      }
      return { emoji: '💀', label: 'Ancient Zombie', color: '#f87171', border: '#b91c1c',
        detail: `Gone for ${formatGone(days)}.` };
    }

    function formatGone(days) {
      if (days == null) return null;
      if (days < 1) return 'less than a day';
      if (days < 30) return `${days} day${days === 1 ? '' : 's'}`;
      if (days < 365) {
        const m = Math.floor(days / 30);
        return `${m} month${m === 1 ? '' : 's'}`;
      }
      const y = Math.floor(days / 365);
      const rem = Math.floor((days % 365) / 30);
      const ys = `${y} year${y === 1 ? '' : 's'}`;
      return rem > 0 ? `${ys}, ${rem} month${rem === 1 ? '' : 's'}` : ys;
    }

    function resolveHex(raw) {
      const value = raw.trim();
      if (!value) throw new Error('Enter an npub, nprofile, or hex pubkey');
      if (value.startsWith('npub1') || value.startsWith('nprofile1')) {
        const decoded = nip19.decode(value);
        if (decoded.type === 'nprofile') return decoded.data.pubkey;
        if (decoded.type === 'npub') return decoded.data;
        throw new Error('Unsupported identifier');
      }
      if (/^[0-9a-f]{64}$/i.test(value)) return value.toLowerCase();
      throw new Error('Enter a valid npub, nprofile, or hex pubkey');
    }

    const els = {
      input: document.getElementById('npub-input'),
      results: document.getElementById('search-results'),
      btn: document.getElementById('check-btn'),
      spinner: document.getElementById('check-spinner'),
      label: document.getElementById('check-label'),
      progress: document.getElementById('progress'),
      error: document.getElementById('error'),
      result: document.getElementById('result'),
      avatar: document.getElementById('r-avatar'),
      name: document.getElementById('r-name'),
      npub: document.getElementById('r-npub'),
      emoji: document.getElementById('r-emoji'),
      rlabel: document.getElementById('r-label'),
      detail: document.getElementById('r-detail'),
      lastseen: document.getElementById('r-lastseen'),
    };

    function looksLikeIdentifier(value) {
      const v = value.trim();
      return v.startsWith('npub1') || v.startsWith('nprofile1') || /^[0-9a-f]{64}$/i.test(v);
    }

    // ----- Primal cache username search (mirrors primalCacheService.js) -----
    const PRIMAL_ENDPOINTS = ['wss://cache2.primal.net/v1', 'wss://cache1.primal.net/v1'];

    function searchUsers(query, limit = 8) {
      return new Promise((resolve) => {
        let settled = false;
        let endpointIndex = 0;
        const results = [];

        function tryEndpoint() {
          if (settled) return;
          if (endpointIndex >= PRIMAL_ENDPOINTS.length) { resolve(results); return; }
          const ws = new WebSocket(PRIMAL_ENDPOINTS[endpointIndex++]);
          const reqId = `zc_${Date.now()}_${endpointIndex}`;
          const timeout = setTimeout(() => { try { ws.close(); } catch (_) {} finish(false); }, 4000);

          function finish(ok) {
            clearTimeout(timeout);
            if (settled) return;
            if (ok || results.length) { settled = true; resolve(results); }
            else { try { ws.close(); } catch (_) {} tryEndpoint(); }
          }

          ws.onopen = () => {
            ws.send(JSON.stringify(['REQ', reqId, { cache: ['user_search', { query, limit }] }]));
          };
          ws.onmessage = (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              const [type, , payload] = msg;
              if (type === 'EVENT' && payload && payload.kind === 0) results.push(payload);
              if (type === 'EOSE') { try { ws.close(); } catch (_) {} settled = true; clearTimeout(timeout); resolve(results); }
            } catch (_) {}
          };
          ws.onerror = () => finish(false);
          ws.onclose = () => { if (!settled && !results.length) finish(false); };
        }
        tryEndpoint();
      });
    }

    function parseProfile(event) {
      try {
        const c = JSON.parse(event.content) || {};
        return {
          pubkey: event.pubkey,
          name: c.name || null,
          display_name: c.display_name || null,
          picture: c.picture || null,
          nip05: c.nip05 || null,
        };
      } catch (_) { return null; }
    }

    let searchSeq = 0;
    function renderSearchResults(profiles) {
      els.results.innerHTML = '';
      if (!profiles.length) { els.results.classList.add('hidden'); return; }
      profiles.forEach((p) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'w-full flex items-center gap-3 px-3 py-2 text-left hover:bg-gray-700 transition-colors';
        const label = p.display_name || p.name || 'Anonymous';
        row.innerHTML = `
          <img src="${p.picture || '/default-avatar.svg'}" onerror="this.src='/default-avatar.svg'"
               class="w-8 h-8 rounded-full object-cover bg-gray-700 flex-shrink-0" alt="" />
          <span class="min-w-0">
            <span class="block text-sm text-white truncate">${escapeHtml(label)}</span>
            ${p.nip05 ? `<span class="block text-xs text-gray-400 truncate">${escapeHtml(p.nip05)}</span>` : ''}
          </span>`;
        row.addEventListener('click', () => {
          hideResults();
          els.input.value = label;
          check(p.pubkey);
        });
        els.results.appendChild(row);
      });
      els.results.classList.remove('hidden');
    }

    function hideResults() {
      els.results.classList.add('hidden');
      els.results.innerHTML = '';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    let debounceId = null;
    els.input.addEventListener('input', () => {
      const value = els.input.value.trim();
      if (debounceId) clearTimeout(debounceId);
      if (value.length < 2 || looksLikeIdentifier(value)) { hideResults(); return; }
      const seq = ++searchSeq;
      debounceId = setTimeout(async () => {
        try {
          const events = await searchUsers(value, 8);
          if (seq !== searchSeq) return; // a newer keystroke superseded this
          const profiles = events
            .map(parseProfile)
            .filter((p) => p && !(p.nip05 && p.nip05.includes('mostr.pub')));
          renderSearchResults(profiles);
        } catch (_) { hideResults(); }
      }, 400);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#search-results') && e.target !== els.input) hideResults();
    });

    async function check(presetHex = null) {
      hideResults();
      els.error.textContent = '';
      els.result.classList.add('hidden');
      els.spinner.classList.remove('hidden');
      els.label.textContent = 'Checking…';
      els.btn.disabled = true;
      els.progress.textContent = 'Resolving identifier…';

      const pool = new SimplePool();
      const extraQueried = []; // user's own relays, so we can close them too
      try {
        const hex = presetHex || resolveHex(els.input.value);

        // Pass 1: default relays, no `kinds` and no `since` — any signed event
        // counts, and a dormant account should report a real last-seen date
        // rather than "nothing in the past year". Profile and relay list ride
        // along in parallel so nothing waits on them.
        const [events, profileEvents, relayListEvents] = await Promise.all([
          scanRelays(pool, RELAYS, { authors: [hex], limit: 20 }, 'default relays', settledAlive),
          pool.querySync(RELAYS, { kinds: [0], authors: [hex], limit: 5 }, { maxWait: PROFILE_TIMEOUT }),
          pool.querySync(RELAYS, { kinds: [10002], authors: [hex], limit: 1 }, { maxWait: PROFILE_TIMEOUT }),
        ]);

        // Escalate only when the verdict could still change. If we already
        // found activity inside the "Alive" band, no additional relay or kind
        // list can make them more alive — so stop here instead of spending
        // another 10 seconds on it.
        if (newestDays(events) === null || newestDays(events) >= ALIVE_DAYS) {
          // A few relays mishandle kind-less filters, and an empty result is
          // exactly what produces a false zombie — so retry with explicit kinds.
          if (!events.length) {
            const byKind = await scanRelays(
              pool, RELAYS, { kinds: LIVENESS_KINDS, authors: [hex], limit: 20 },
              'default relays (explicit kinds)',
            );
            events.push(...byKind);
          }

          // Also check the relays this user advertises (NIP-65): someone who
          // only publishes to their own or a niche relay isn't a zombie just
          // because our defaults never saw them.
          const extraRelays = relayListEvents.length
            ? [...new Set(
                relayListEvents[0].tags
                  .filter((t) => t[0] === 'r' && t[1])
                  .map((t) => t[1]),
              )].filter((url) => !RELAYS.includes(url)).slice(0, 8)
            : [];

          if (extraRelays.length) {
            extraQueried.push(...extraRelays);
            const own = await scanRelays(
              pool, extraRelays, { authors: [hex], limit: 20 },
              'their own relays',
            );
            events.push(...own);
          }
        }

        const sorted = events.slice().sort((a, b) => b.created_at - a.created_at);
        const newest = sorted[0] || null;
        const days = newestDays(events);

        let profile = {};
        let deleted = false;
        if (profileEvents.length) {
          const latest = profileEvents.slice().sort((a, b) => b.created_at - a.created_at)[0];
          try { profile = JSON.parse(latest.content) || {}; } catch (_) { profile = {}; }
          deleted = profile.deleted === true || profile.deleted === 'true';
        }

        render(hex, profile, classify(days, deleted), newest);
      } catch (e) {
        console.error('Zombie Check failed:', e);
        els.error.textContent = e?.message || 'Failed to check this user. Try again.';
      } finally {
        try { pool.close([...RELAYS, ...extraQueried]); } catch (_) {}
        els.spinner.classList.add('hidden');
        els.label.textContent = '🧟 Check for Zombie';
        els.btn.disabled = false;
        els.progress.textContent = '';
      }
    }

    function render(hex, profile, verdict, newest) {
      const npub = nip19.npubEncode(hex);
      els.avatar.src = profile.picture || '/default-avatar.svg';
      els.avatar.onerror = () => { els.avatar.src = '/default-avatar.svg'; };
      els.name.textContent = profile.display_name || profile.name || 'Anonymous';
      els.npub.textContent = `${npub.slice(0, 12)}…${npub.slice(-6)}`;
      els.npub.href = `https://njump.me/${npub}`;

      if (verdict.iconFallback && !supportsAnatomicalHeart()) {
        els.emoji.textContent = '';
        const img = document.createElement('img');
        img.src = verdict.iconFallback;
        img.alt = verdict.label;
        img.className = 'inline-block align-middle h-12 w-12';
        els.emoji.appendChild(img);
      } else {
        els.emoji.textContent = verdict.emoji;
      }
      els.emoji.classList.toggle('animate-heartbeat', !!verdict.beat);
      els.rlabel.textContent = verdict.label;
      els.rlabel.style.color = verdict.color;
      els.detail.textContent = verdict.detail;
      els.lastseen.textContent = newest
        ? `Last activity: ${new Date(newest.created_at * 1000).toLocaleDateString()}`
        : '';

      els.result.style.borderColor = verdict.border;
      els.result.classList.remove('hidden');
    }

    els.btn.addEventListener('click', () => check());
    els.input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const value = els.input.value.trim();
      // Identifier → check directly. Username → use the first search result if any.
      if (looksLikeIdentifier(value)) { check(); return; }
      const firstResult = els.results.querySelector('button');
      if (firstResult) firstResult.click();
      else check();
    });

    // Allow deep-linking a target: /zombiecheck?npub=npub1...
    const params = new URLSearchParams(location.search);
    const preset = params.get('npub') || params.get('pubkey');
    if (preset) {
      els.input.value = preset;
      check();
    }
  </script>
</body>
</html>
